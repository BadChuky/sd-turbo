[project]
name = "generador-imagenes"
version = "0.1.0"
description = "Generador de imágenes a partir de texto con Stable Diffusion (sd-turbo)"
authors = [
    { name = "Jairo Andres Niño Santos" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.41.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
generador-imagenes = "generador_imagenes:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
